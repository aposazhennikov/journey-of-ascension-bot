<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMax slice">
  <!-- Stylised Mount Kailash drawn for the map (original artwork): deep sky, a domed snow peak with
       short staggered rock ledges, a dark rock base and brown sedimentary foothills. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#174a96"/>
      <stop offset="0.5" stop-color="#2f6fbe"/>
      <stop offset="1" stop-color="#8fbbe3"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#cfd8e4"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4744"/>
      <stop offset="1" stop-color="#3b3032"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6d58"/>
      <stop offset="1" stop-color="#6b5243"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6846b"/>
      <stop offset="1" stop-color="#806250"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ece5db" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <!-- far ranges -->
  <path d="M0 650 L70 618 L150 632 L230 600 L300 622 L1000 622 L1000 720 L0 720 Z" fill="#6e6a7a" opacity="0.5"/>
  <path d="M640 628 L720 598 L800 612 L880 586 L960 604 L1000 596 L1000 720 L640 720 Z" fill="#5e596a" opacity="0.55"/>
  <!-- the peak is scaled up around its base so the snow flanks show beside the shoulders of the figure -->
  <g transform="translate(500 660) scale(1.32 1.3) translate(-500 -660)">
  <!-- rock body of the mountain -->
  <path d="M120 660 C200 560 270 470 340 380 C390 316 430 250 470 214 C490 196 512 196 532 214
           C575 252 618 318 668 386 C736 478 806 568 880 660 Z" fill="url(#rock)"/>
  <!-- snow: a domed summit, the lower edge broken by rock -->
  <path d="M262 478 C300 430 340 382 378 336 C414 290 446 244 474 218 C492 202 510 202 528 218
           C560 248 598 300 636 352 C674 404 712 452 752 500
           L728 506 L706 492 L688 512 L664 498 L640 520 L618 500 L596 514 L572 494 L548 518 L528 498
           L506 512 L484 494 L462 516 L440 498 L418 514 L396 496 L372 512 L350 494 L326 508 L304 490 L284 502 Z"
        fill="url(#snow)"/>
  <!-- short rock ledges, staggered like the strata of the real peak -->
  <g fill="#4a3b39">
    <path d="M410 300 q22 -4 44 0 l-3 6 q-20 -3 -40 1 z" opacity="0.8"/>
    <path d="M520 286 q18 -3 36 1 l-2 5 q-17 -2 -33 0 z" opacity="0.75"/>
    <path d="M462 248 q14 -2 26 1 l-2 4 q-12 -2 -23 0 z" opacity="0.6"/>
    <path d="M372 356 q30 -5 60 -1 l-4 7 q-27 -3 -54 2 z" opacity="0.85"/>
    <path d="M470 346 q26 -4 50 0 l-3 6 q-23 -3 -45 1 z" opacity="0.8"/>
    <path d="M566 340 q28 -3 54 3 l-4 6 q-24 -4 -48 -2 z" opacity="0.8"/>
    <path d="M334 412 q34 -6 70 -2 l-4 8 q-32 -4 -63 2 z" opacity="0.85"/>
    <path d="M440 404 q30 -4 58 0 l-3 7 q-27 -3 -52 1 z" opacity="0.8"/>
    <path d="M540 398 q24 -3 46 0 l-3 6 q-21 -2 -41 1 z" opacity="0.75"/>
    <path d="M610 410 q32 -3 62 5 l-5 7 q-28 -6 -55 -4 z" opacity="0.85"/>
    <path d="M300 460 q30 -5 60 -1 l-4 7 q-27 -3 -53 2 z" opacity="0.8"/>
    <path d="M404 458 q34 -5 66 0 l-4 7 q-30 -3 -59 1 z" opacity="0.85"/>
    <path d="M512 452 q28 -3 54 1 l-3 6 q-25 -3 -48 0 z" opacity="0.8"/>
    <path d="M606 462 q34 -3 66 6 l-5 7 q-30 -6 -58 -4 z" opacity="0.85"/>
    <!-- a soft dark streak down the face, off-centre and broken -->
    <path d="M497 262 q-3 18 0 34 l6 0 q2 -17 0 -34 z" opacity="0.45"/>
    <path d="M495 312 q-2 14 1 28 l6 0 q1 -14 -1 -28 z" opacity="0.4"/>
  </g>
  <!-- light from the left: the right flank in shade -->
  <path d="M532 214 C575 252 618 318 668 386 C736 478 806 568 880 660 L660 660 C630 560 590 440 560 330 Z" fill="#1b2335" opacity="0.2"/>
  </g>
  <!-- foothills, sedimentary layers -->
  <path d="M0 720 L90 668 L170 646 L250 660 L340 620 L430 634 L490 660 L560 690 L1000 700 L1000 1000 L0 1000 Z" fill="url(#hillA)"/>
  <path d="M580 700 L660 652 L740 630 L830 622 L920 610 L1000 620 L1000 1000 L540 1000 Z" fill="#5b4539"/>
  <g stroke="#5a4437" stroke-width="3" fill="none" opacity="0.5">
    <path d="M40 706 Q170 680 300 668 Q380 662 450 670"/>
    <path d="M10 744 Q170 718 330 708 Q450 704 560 718"/>
    <path d="M690 668 Q790 648 890 644 Q960 642 1000 648"/>
  </g>
  <path d="M0 810 Q200 752 420 772 Q620 790 800 762 Q920 744 1000 752 L1000 1000 L0 1000 Z" fill="url(#hillB)"/>
  <path d="M0 886 Q260 848 520 862 Q760 876 1000 852 L1000 1000 L0 1000 Z" fill="#b49579"/>
  <rect y="580" width="1000" height="420" fill="url(#haze)"/>
</svg>
